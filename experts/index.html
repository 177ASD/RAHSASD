<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Experts — справочники</title>
    <!-- Подключаем библиотеку для преобразования Markdown в HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #f5faf0;
            --card: #ffffffcc;
            --text: #2d3e2b;
            --accent: #6b8c5c;
            --border: #d9e8d4;
            --code-bg: #eef3ea;
        }

        body.dark {
            --bg: #1a2a1f;
            --card: #2a3a26cc;
            --text: #e0f0da;
            --accent: #8ab87a;
            --border: #3a5535;
            --code-bg: #2a3a26;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 2rem 1rem;
            transition: all 0.2s;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 2rem;
            gap: 1rem;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 500;
            letter-spacing: -0.3px;
        }

        .theme-toggle {
            background: var(--card);
            backdrop-filter: blur(4px);
            border: 1px solid var(--border);
            border-radius: 40px;
            padding: 0.4rem 1rem;
            cursor: pointer;
            font-size: 1.1rem;
            color: var(--text);
        }

        .folder-badge {
            background: var(--card);
            backdrop-filter: blur(4px);
            border: 1px solid var(--border);
            border-radius: 2rem;
            padding: 0.3rem 1rem;
            display: inline-block;
            margin-bottom: 1.5rem;
            font-size: 0.8rem;
        }

        .file-list {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-bottom: 2rem;
        }

        .file-card {
            background: var(--card);
            backdrop-filter: blur(4px);
            border: 1px solid var(--border);
            border-radius: 1rem;
            transition: all 0.2s;
        }

        .file-card:hover {
            transform: translateX(5px);
            background: rgba(255, 255, 255, 0.9);
        }

        body.dark .file-card:hover {
            background: rgba(60, 90, 55, 0.9);
        }

        .file-card a {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.9rem 1.2rem;
            text-decoration: none;
            color: var(--text);
        }

        .file-icon {
            font-size: 1.5rem;
        }

        .file-name {
            flex: 1;
            font-weight: 470;
            word-break: break-word;
        }

        .file-type {
            font-size: 0.7rem;
            background: rgba(0,0,0,0.08);
            padding: 0.2rem 0.6rem;
            border-radius: 1rem;
            font-family: monospace;
        }

        .arrow {
            opacity: 0.4;
            font-size: 1rem;
        }

        /* Стили для отформатированного README.md */
        .readme-section {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 2px solid var(--border);
        }

        .readme-title {
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .markdown-body {
            background: var(--card);
            backdrop-filter: blur(4px);
            border: 1px solid var(--border);
            border-radius: 1rem;
            padding: 1.5rem;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .markdown-body h1 { font-size: 1.5rem; margin: 1rem 0 0.5rem; }
        .markdown-body h2 { font-size: 1.3rem; margin: 1rem 0 0.5rem; }
        .markdown-body h3 { font-size: 1.1rem; margin: 0.8rem 0 0.4rem; }
        .markdown-body p { margin: 0.5rem 0; }
        .markdown-body table {
            border-collapse: collapse;
            width: 100%;
            margin: 1rem 0;
        }
        .markdown-body th, .markdown-body td {
            border: 1px solid var(--border);
            padding: 0.5rem;
            text-align: left;
        }
        .markdown-body th {
            background: rgba(0,0,0,0.05);
        }
        .markdown-body code {
            background: var(--code-bg);
            padding: 0.2rem 0.4rem;
            border-radius: 0.3rem;
            font-family: monospace;
        }
        .markdown-body pre {
            background: var(--code-bg);
            padding: 0.8rem;
            border-radius: 0.5rem;
            overflow-x: auto;
        }
        .markdown-body blockquote {
            border-left: 3px solid var(--accent);
            margin: 0.5rem 0;
            padding-left: 1rem;
            color: var(--text);
            opacity: 0.8;
        }
        .markdown-body hr {
            margin: 1rem 0;
            border: none;
            border-top: 1px solid var(--border);
        }

        .loading, .empty {
            text-align: center;
            padding: 2rem;
            color: var(--text);
            opacity: 0.7;
        }

        .footer {
            margin-top: 2rem;
            text-align: right;
            font-size: 0.7rem;
            opacity: 0.6;
        }

        @media (max-width: 550px) {
            body { padding: 1rem; }
            .file-card a { flex-wrap: wrap; gap: 0.4rem; }
            .file-name { width: 100%; }
            .markdown-body { padding: 1rem; }
            .markdown-body table { font-size: 0.8rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📁 experts/</h1>
        <div class="theme-toggle" id="themeToggle">☼ / ☾</div>
    </div>

    <div class="folder-badge">
        🧠 рабочие справочники, карты, тарифы
    </div>

    <div id="fileListContainer">
        <div class="loading">📂 загрузка файлов...</div>
    </div>

    <div id="readmeContainer" class="readme-section" style="display: none;">
        <div class="readme-title">
            <span>📚</span> Справочный раздел
        </div>
        <div id="markdownContent" class="markdown-body"></div>
    </div>

    <div class="footer" id="footerDate">ASD © <span id="currentDate"></span></div>
</div>

<script>
    // === переключение темы ===
    const themeToggle = document.getElementById('themeToggle');
    const body = document.body;
    if (localStorage.getItem('theme') === 'dark') body.classList.add('dark');
    themeToggle.addEventListener('click', () => {
        body.classList.toggle('dark');
        localStorage.setItem('theme', body.classList.contains('dark') ? 'dark' : 'light');
    });

    // === дата ===
    const today = new Date();
    document.getElementById('currentDate').textContent = `${today.getFullYear()}·${String(today.getMonth()+1).padStart(2,'0')}·${String(today.getDate()).padStart(2,'0')}`;

    // === КОНФИГУРАЦИЯ GITHUB ===
    const USER = '177ASD';
    const REPO = 'RAHSASD';
    const BRANCH = 'main';
    const FOLDER = 'experts';

    // файлы, которые НЕ нужно показывать в меню
    const EXCLUDE_FILES = ['index.html', 'ReadMe.txt', 'README.md'];

    // иконка по расширению
    function getIcon(filename) {
        const ext = filename.split('.').pop().toLowerCase();
        if (ext === 'html') return '🌐';
        if (ext === 'pdf') return '📑';
        if (ext === 'txt') return '📄';
        if (ext === 'docx') return '📝';
        if (ext === 'md') return '📘';
        return '📄';
    }

    // правильная ссылка = GitHub Pages, а не raw
    function getPageUrl(filename) {
        const encoded = encodeURIComponent(filename).replace(/%2F/g, '/');
        return `https://${USER}.github.io/${REPO}/${FOLDER}/${encoded}`;
    }

    // загрузка списка файлов
    async function loadFolderContents() {
        const container = document.getElementById('fileListContainer');
        const apiUrl = `https://api.github.com/repos/${USER}/${REPO}/contents/${FOLDER}?ref=${BRANCH}`;
        
        try {
            const response = await fetch(apiUrl);
            if (!response.ok) throw new Error(`GitHub API error: ${response.status}`);
            
            const files = await response.json();
            if (!Array.isArray(files)) throw new Error('Некорректный ответ API');
            
            let fileList = files.filter(f => 
                f.type === 'file' && 
                !EXCLUDE_FILES.includes(f.name)
            );
            
            fileList.sort((a, b) => a.name.localeCompare(b.name));
            
            if (fileList.length === 0) {
                container.innerHTML = '<div class="empty">📭 нет доступных документов</div>';
                return;
            }
            
            let html = '<div class="file-list">';
            for (const file of fileList) {
                const fileName = file.name;
                const fileUrl = getPageUrl(fileName);
                const icon = getIcon(fileName);
                const ext = fileName.split('.').pop().toLowerCase();
                
                html += `
                    <div class="file-card">
                        <a href="${fileUrl}" target="_blank">
                            <div class="file-icon">${icon}</div>
                            <div class="file-name">${escapeHtml(fileName)}</div>
                            <div class="file-type">${ext}</div>
                            <div class="arrow">→</div>
                        </a>
                    </div>
                `;
            }
            html += '</div>';
            container.innerHTML = html;
            
        } catch (error) {
            console.error(error);
            container.innerHTML = '<div class="empty">⚠️ не удалось загрузить список файлов</div>';
        }
    }

    // загрузка и отображение README.md как форматированного HTML
    async function loadReadme() {
        const readmeUrl = `https://raw.githubusercontent.com/${USER}/${REPO}/${BRANCH}/${FOLDER}/README.md`;
        const readmeContainer = document.getElementById('readmeContainer');
        const markdownContent = document.getElementById('markdownContent');
        
        try {
            const response = await fetch(readmeUrl);
            if (!response.ok) {
                // если README.md нет — просто скрываем блок
                readmeContainer.style.display = 'none';
                return;
            }
            
            const markdown = await response.text();
            // проверяем, что это не пустой файл и не ошибка
            if (!markdown || markdown.trim() === '') {
                readmeContainer.style.display = 'none';
                return;
            }
            
            // преобразуем Markdown в HTML с помощью библиотеки marked
            const html = marked.parse(markdown);
            markdownContent.innerHTML = html;
            readmeContainer.style.display = 'block';
            
        } catch (error) {
            console.warn('README.md не загружен:', error);
            readmeContainer.style.display = 'none';
        }
    }
    
    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    loadFolderContents();
    loadReadme();
</script>
</body>
</html>
