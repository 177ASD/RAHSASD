<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Справочники 177ASD</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            padding: 2rem 1.5rem;
            color: #f1f5f9;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Шапка */
        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #c084fc, #60a5fa);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: #94a3b8;
            font-size: 1.1rem;
        }

        /* Карточки */
        .links-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .link-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(71, 85, 105, 0.5);
            border-radius: 1.5rem;
            transition: all 0.25s ease;
            overflow: hidden;
        }

        .link-card:hover {
            background: rgba(51, 65, 85, 0.8);
            border-color: #818cf8;
            transform: translateX(6px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .link-card a {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1.2rem 1.5rem;
            text-decoration: none;
            color: #f1f5f9;
            font-weight: 500;
            font-size: 1.1rem;
        }

        /* Иконки для разных типов */
        .icon {
            font-size: 1.8rem;
            min-width: 2.5rem;
            text-align: center;
        }

        .file-info {
            flex: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .file-name {
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.9rem;
            background: #0f172a;
            padding: 0.25rem 0.7rem;
            border-radius: 2rem;
            color: #a5f3fc;
        }

        .arrow {
            font-size: 1.2rem;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .link-card:hover .arrow {
            opacity: 1;
            transform: translateX(3px);
        }

        /* Подвал */
        .footer {
            margin-top: 3rem;
            text-align: center;
            font-size: 0.8rem;
            color: #475569;
            border-top: 1px solid #334155;
            padding-top: 2rem;
        }

        /* Адаптивность */
        @media (max-width: 550px) {
            body {
                padding: 1.2rem;
            }
            .link-card a {
                flex-wrap: wrap;
                gap: 0.6rem;
            }
            .file-info {
                width: 100%;
                justify-content: space-between;
            }
            .header h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📚 Справочники 177ASD</h1>
        <p>Быстрый доступ к часто используемым файлам</p>
    </div>

    <div class="links-grid">
        <!-- Ссылка на h2o.html -->
        <div class="link-card">
            <a href="h2o.html">
                <div class="icon">💧</div>
                <div class="file-info">
                    <span>🌊 Водородная химия / H₂O</span>
                    <span class="file-name">h2o.html</span>
                </div>
                <div class="arrow">→</div>
            </a>
        </div>

        <!-- Ссылка на speed_con.html -->
        <div class="link-card">
            <a href="speed_con.html">
                <div class="icon">⚡</div>
                <div class="file-info">
                    <span>🚀 Скорость / Конвертеры</span>
                    <span class="file-name">speed_con.html</span>
                </div>
                <div class="arrow">→</div>
            </a>
        </div>

        <!-- Ссылка на test_date.html -->
        <div class="link-card">
            <a href="test_date.html">
                <div class="icon">📅</div>
                <div class="file-info">
                    <span>🗓️ Генерация дат / Календарь</span>
                    <span class="file-name">test_date.html</span>
                </div>
                <div class="arrow">→</div>
            </a>
        </div>
    </div>

    <div class="footer">
        ⚡ GitHub Pages · удобная навигация · обновляется автоматически
    </div>
</div>
</body>
</html>
