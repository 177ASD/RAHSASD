<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конвертер Скорости</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-gradient-light: linear-gradient(135deg, #e0f7fa 0%, #e1bee7 50%, #f8bbd9 100%);
            --bg-gradient-dark: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            
            --glass-bg-light: rgba(255, 255, 255, 0.25);
            --glass-bg-dark: rgba(255, 255, 255, 0.08);
            
            --glass-border-light: rgba(255, 255, 255, 0.4);
            --glass-border-dark: rgba(255, 255, 255, 0.15);
            
            --text-primary-light: #1a1a2e;
            --text-primary-dark: #ffffff;
            
            --text-secondary-light: #4a4a6a;
            --text-secondary-dark: #b8b8d1;
            
            --accent-cyan: #00bcd4;
            --accent-blue: #2196f3;
            --accent-purple: #9c27b0;
            --accent-pink: #e91e63;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            min-height: 100vh;
            background: var(--bg-gradient-light);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        body.dark {
            background: var(--bg-gradient-dark);
        }

        /* Animated Background Orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation: float 8s ease-in-out infinite;
            z-index: -1;
        }

        .orb-1 {
            width: 200px;
            height: 200px;
            background: var(--accent-cyan);
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 250px;
            height: 250px;
            background: var(--accent-purple);
            bottom: 10%;
            right: 10%;
            animation-delay: 2s;
        }

        .orb-3 {
            width: 180px;
            height: 180px;
            background: var(--accent-pink);
            top: 50%;
            right: 30%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.05); }
            66% { transform: translate(-20px, 20px) scale(0.95); }
        }

        /* Main Container */
        .container {
            width: 100%;
            max-width: 400px;
            position: relative;
            z-index: 1;
        }

        /* Theme Toggle */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 60px;
            height: 32px;
            background: var(--glass-bg-light);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border-light);
            border-radius: 16px;
            cursor: pointer;
            padding: 3px;
            transition: all 0.3s ease;
            z-index: 100;
        }

        body.dark .theme-toggle {
            background: var(--glass-bg-dark);
            border-color: var(--glass-border-dark);
        }

        .toggle-slider {
            width: 26px;
            height: 26px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            border-radius: 50%;
            transition: transform 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        body.dark .toggle-slider {
            transform: translateX(28px);
        }

        /* Card */
        .card {
            background: var(--glass-bg-light);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--glass-border-light);
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            animation: slideUp 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.dark .card {
            background: var(--glass-bg-dark);
            border-color: var(--glass-border-dark);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary-light);
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        body.dark .header h1 {
            color: var(--text-primary-dark);
        }

        .header p {
            font-size: 14px;
            color: var(--text-secondary-light);
            font-weight: 400;
        }

        body.dark .header p {
            color: var(--text-secondary-dark);
        }

        /* Input Group */
        .input-group {
            margin-bottom: 24px;
            position: relative;
        }

        .input-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary-light);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        body.dark .input-label {
            color: var(--text-secondary-dark);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-field {
            width: 100%;
            padding: 18px 70px 18px 20px;
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary-light);
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid transparent;
            border-radius: 16px;
            outline: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        body.dark .input-field {
            color: var(--text-primary-dark);
            background: rgba(255, 255, 255, 0.08);
        }

        .input-field:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 4px rgba(0, 188, 212, 0.15);
            transform: scale(1.02);
        }

        .input-field::placeholder {
            color: var(--text-secondary-light);
            opacity: 0.6;
        }

        .unit-badge {
            position: absolute;
            right: 12px;
            padding: 6px 12px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            color: white;
            font-size: 12px;
            font-weight: 700;
            border-radius: 8px;
            pointer-events: none;
        }

        /* Swap Button */
        .swap-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            margin: 8px auto;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
            border: none;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(156, 39, 176, 0.35);
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        .swap-btn:hover {
            transform: scale(1.1) rotate(90deg);
            box-shadow: 0 6px 24px rgba(156, 39, 176, 0.45);
        }

        .swap-btn:active {
            transform: scale(0.95) rotate(90deg);
        }

        .swap-btn svg {
            width: 24px;
            height: 24px;
            fill: white;
            transition: transform 0.3s ease;
        }

        /* Result Section */
        .result-section {
            background: linear-gradient(135deg, rgba(0, 188, 212, 0.15), rgba(156, 39, 176, 0.15));
            border: 1px solid rgba(156, 39, 176, 0.2);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            position: relative;
            overflow: hidden;
            animation: fadeIn 0.5s ease;
        }

        .result-section::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(233, 30, 99, 0.1) 0%, transparent 70%);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .result-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary-light);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            position: relative;
        }

        body.dark .result-label {
            color: var(--text-secondary-dark);
        }

        .result-value {
            font-size: 42px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
            position: relative;
            animation: countUp 0.4s ease-out;
        }

        @keyframes countUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-unit {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-secondary-light);
            margin-top: 4px;
            position: relative;
        }

        body.dark .result-unit {
            color: var(--text-secondary-dark);
        }

        /* Formula Display */
        .formula {
            margin-top: 24px;
            padding: 16px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            text-align: center;
            font-size: 13px;
            color: var(--text-secondary-light);
            font-weight: 500;
            border: 1px dashed var(--glass-border-light);
        }

        body.dark .formula {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary-dark);
            border-color: var(--glass-border-dark);
        }

        .formula code {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
            font-size: 14px;
        }

        /* Quick Values */
        .quick-values {
            margin-top: 24px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .quick-value {
            padding: 12px 8px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid var(--glass-border-light);
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary-light);
        }

        body.dark .quick-value {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--glass-border-dark);
            color: var(--text-secondary-dark);
        }

        .quick-value:hover {
            background: linear-gradient(135deg, rgba(0, 188, 212, 0.2), rgba(156, 39, 176, 0.2));
            transform: translateY(-2px);
            border-color: var(--accent-purple);
        }

        .quick-value span {
            display: block;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary-light);
            margin-bottom: 2px;
        }

        body.dark .quick-value span {
            color: var(--text-primary-dark);
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 11px;
            color: var(--text-secondary-light);
            opacity: 0.7;
        }

        body.dark .footer {
            color: var(--text-secondary-dark);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container {
                max-width: 100%;
            }
            
            .card {
                padding: 24px 20px;
                border-radius: 20px;
            }
            
            .header h1 {
                font-size: 24px;
            }
            
            .input-field {
                font-size: 20px;
                padding: 16px 65px 16px 16px;
            }
            
            .result-value {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <!-- Animated Background Orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <!-- Theme Toggle -->
    <div class="theme-toggle" onclick="toggleTheme()">
        <div class="toggle-slider">☀️</div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <div class="card">
            <!-- Header -->
            <div class="header">
                <h1>⚡ Конвертер Скорости</h1>
                <p>Мгновенный перевод единиц измерения</p>
            </div>

            <!-- Input Field -->
            <div class="input-group">
                <label class="input-label" id="inputLabel">Введите скорость в м/с</label>
                <div class="input-wrapper">
                    <input 
                        type="number" 
                        class="input-field" 
                        id="speedInput" 
                        placeholder="0"
                        oninput="convertSpeed()"
                    >
                    <span class="unit-badge" id="inputUnit">м/с</span>
                </div>
            </div>

            <!-- Swap Button -->
            <button class="swap-btn" onclick="swapUnits()" title="Поменять местами">
                <svg viewBox="0 0 24 24">
                    <path d="M7 8V4H17V8M7 8L3 4M7 8L11 4M17 16V20H7V16M17 16L21 20M17 16L13 20"/>
                </svg>
            </button>

            <!-- Result -->
            <div class="result-section">
                <div class="result-label" id="resultLabel">Результат в км/ч</div>
                <div class="result-value" id="resultValue">0</div>
                <div class="result-unit" id="resultUnitDisplay">км/ч</div>
            </div>

            <!-- Formula -->
            <div class="formula">
                Формула: <code id="formulaText">м/с × 3.6 = км/ч</code>
            </div>

            <!-- Quick Values -->
            <div class="quick-values">
                <div class="quick-value" onclick="setQuickValue(1)">
                    <span>1</span> м/с
                </div>
                <div class="quick-value" onclick="setQuickValue(10)">
                    <span>10</span> м/с
                </div>
                <div class="quick-value" onclick="setQuickValue(25)">
                    <span>25</span> м/с
                </div>
                <div class="quick-value" onclick="setQuickValue(50)">
                    <span>50</span> м/с
                </div>
                <div class="quick-value" onclick="setQuickValue(100)">
                    <span>100</span> м/с
                </div>
                <div class="quick-value" onclick="setQuickValue(340)">
                    <span>340</span> м/с
                </div>
            </div>

            <!-- Footer -->
            <div class="footer">
                Нажмите на значения для быстрого ввода • Перетащите для обмена
            </div>
        </div>
    </div>

    <script>
        let isMsToKmh = true;

        // Theme Toggle
        function toggleTheme() {
            document.body.classList.toggle('dark');
            const slider = document.querySelector('.toggle-slider');
            if (document.body.classList.contains('dark')) {
                slider.textContent = '🌙';
            } else {
                slider.textContent = '☀️';
            }
            saveTheme();
        }

        // Load saved theme
        function loadTheme() {
            const savedTheme = localStorage.getItem('converter-theme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark');
                document.querySelector('.toggle-slider').textContent = '🌙';
            }
        }

        // Save theme preference
        function saveTheme() {
            localStorage.setItem('converter-theme', document.body.classList.contains('dark') ? 'dark' : 'light');
        }

        // Convert Speed
        function convertSpeed() {
            const input = parseFloat(document.getElementById('speedInput').value) || 0;
            let result;
            
            if (isMsToKmh) {
                result = input * 3.6;
            } else {
                result = input / 3.6;
            }
            
            // Animate result update
            const resultElement = document.getElementById('resultValue');
            resultElement.style.animation = 'none';
            resultElement.offsetHeight; // Trigger reflow
            resultElement.style.animation = 'countUp 0.4s ease-out';
            
            // Format result (max 2 decimal places)
            document.getElementById('resultValue').textContent = formatNumber(result);
        }

        // Format number nicely
        function formatNumber(num) {
            if (Number.isInteger(num)) {
                return num.toString();
            }
            return Math.round(num * 100) / 100;
        }

        // Swap Units
        function swapUnits() {
            isMsToKmh = !isMsToKmh;
            
            const inputLabel = document.getElementById('inputLabel');
            const inputUnit = document.getElementById('inputUnit');
            const resultLabel = document.getElementById('resultLabel');
            const resultUnitDisplay = document.getElementById('resultUnitDisplay');
            const formulaText = document.getElementById('formulaText');
            
            if (isMsToKmh) {
                inputLabel.textContent = 'Введите скорость в м/с';
                inputUnit.textContent = 'м/с';
                resultLabel.textContent = 'Результат в км/ч';
                resultUnitDisplay.textContent = 'км/ч';
                formulaText.textContent = 'м/с × 3.6 = км/ч';
            } else {
                inputLabel.textContent = 'Введите скорость в км/ч';
                inputUnit.textContent = 'км/ч';
                resultLabel.textContent = 'Результат в м/с';
                resultUnitDisplay.textContent = 'м/с';
                formulaText.textContent = 'км/ч ÷ 3.6 = м/с';
            }
            
            convertSpeed();
        }

        // Set Quick Value
        function setQuickValue(value) {
            document.getElementById('speedInput').value = value;
            convertSpeed();
            
            // Add visual feedback
            const input = document.getElementById('speedInput');
            input.style.transform = 'scale(1.02)';
            setTimeout(() => {
                input.style.transform = 'scale(1)';
            }, 150);
        }

        // Initialize
        loadTheme();
        
        // Add keyboard support for Enter key
        document.getElementById('speedInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                this.blur();
            }
        });
    </script>
</body>
</html>
