<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор диапазонов</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-gradient-start: #e8f4fc;
            --bg-gradient-end: #fff5f5;
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.4);
            --text-primary: #2c3e50;
            --text-secondary: #5a6c7d;
            --accent-blue: #74b9ff;
            --accent-pink: #fd79a8;
            --accent-orange: #fab1a0;
            --shadow-color: rgba(116, 185, 255, 0.15);
            --input-bg: rgba(255, 255, 255, 0.9);
            --button-primary: linear-gradient(135deg, #74b9ff 0%, #a29bfe 100%);
            --button-copy: linear-gradient(135deg, #fd79a8 0%, #e17055 100%);
            --button-download: linear-gradient(135deg, #ffeaa7 0%, #fab1a0 100%);
            --info-bg: rgba(116, 185, 255, 0.12);
            --info-text: #0984e3;
            --footer-text: rgba(44, 62, 80, 0.35);
        }

        [data-theme="dark"] {
            --bg-gradient-start: #1a1a2e;
            --bg-gradient-end: #16213e;
            --glass-bg: rgba(30, 40, 70, 0.6);
            --glass-border: rgba(100, 120, 180, 0.25);
            --text-primary: #dfe6e9;
            --text-secondary: #b2bec3;
            --accent-blue: #81ecec;
            --accent-pink: #ff7675;
            --accent-orange: #ffeaa7;
            --shadow-color: rgba(129, 236, 236, 0.1);
            --input-bg: rgba(20, 30, 50, 0.7);
            --button-primary: linear-gradient(135deg, #00cec9 0%, #6c5ce7 100%);
            --button-copy: linear-gradient(135deg, #ff7675 0%, #e17055 100%);
            --button-download: linear-gradient(135deg, #ffeaa7 0%, #fdcb6e 100%);
            --info-bg: rgba(129, 236, 236, 0.08);
            --info-text: #81ecec;
            --footer-text: rgba(223, 230, 233, 0.25);
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            position: relative;
            overflow-x: hidden;
            transition: all 0.5s ease;
        }

        /* Floating clouds effect */
        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 20s ease-in-out infinite;
            z-index: -1;
        }

        body::before {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--accent-pink), transparent);
            top: -100px;
            right: -100px;
        }

        body::after {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, var(--accent-blue), transparent);
            bottom: -80px;
            left: -80px;
            animation-delay: -10s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.05); }
            66% { transform: translate(-20px, 20px) scale(0.95); }
        }

        /* Theme toggle */
        .theme-toggle {
            position: fixed;
            top: 25px;
            right: 25px;
            z-index: 1000;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            padding: 10px 18px;
            cursor: pointer;
            font-size: 24px;
            color: var(--text-primary);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--shadow-color);
            user-select: none;
        }

        .theme-toggle:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px var(--shadow-color);
        }

        .theme-toggle:active {
            transform: scale(0.98);
        }

        /* Main container */
        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 600px;
            box-shadow: 
                0 8px 32px var(--shadow-color),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            animation: slideUp 0.6s ease-out;
            position: relative;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: var(--text-primary);
            margin: 0 0 20px 0;
            font-size: 26px;
            font-weight: 600;
            text-align: center;
            letter-spacing: -0.3px;
        }

        /* Info hint - reduced size */
        .info {
            background: var(--info-bg);
            padding: 8px 14px;
            border-radius: 12px;
            margin: 0 0 20px 0;
            font-size: 11px;
            color: var(--info-text);
            text-align: center;
            border: 1px solid transparent;
            transition: all 0.3s ease;
        }

        .info:hover {
            border-color: var(--accent-blue);
            box-shadow: 0 2px 8px var(--shadow-color);
        }

        .info code {
            font-family: 'Consolas', monospace;
            background: rgba(0, 0, 0, 0.06);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10.5px;
        }

        [data-theme="dark"] .info code {
            background: rgba(255, 255, 255, 0.08);
        }

        /* Input groups */
        .input-group {
            margin: 16px 0;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        label {
            display: inline-block;
            color: var(--text-primary);
            font-weight: 500;
            font-size: 14px;
            min-width: fit-content;
        }

        input[type="date"],
        input[type="number"] {
            padding: 12px 16px;
            font-size: 15px;
            font-family: inherit;
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--text-primary);
            outline: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        input[type="date"] {
            width: auto;
            min-width: 170px;
            cursor: pointer;
        }

        input[type="number"] {
            width: 90px;
        }

        input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(116, 185, 255, 0.2);
            transform: translateY(-1px);
        }

        input:hover:not(:focus) {
            border-color: var(--accent-pink);
        }

        /* Buttons container */
        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 22px;
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
            min-width: 130px;
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        button:hover::before {
            left: 100%;
        }

        button:first-child {
            background: var(--button-primary);
            box-shadow: 0 4px 15px rgba(116, 185, 255, 0.35);
        }

        button.copy {
            background: var(--button-copy);
            box-shadow: 0 4px 15px rgba(253, 121, 168, 0.35);
        }

        button.download {
            background: var(--button-download);
            box-shadow: 0 4px 15px rgba(250, 177, 160, 0.35);
            color: #2c3e50;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--shadow-color);
        }

        button:active {
            transform: translateY(0);
        }

        /* Textarea */
       textarea {
    width: 100%;
    height: 110px;
    padding: 16px;
    font-family: inherit;  /* ← ИЗМЕНИТЬ ЗДЕСЬ */
    font-size: 13px;
    line-height: 1.6;
    /* ... остальное без изменений ... */
}

        textarea:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(116, 185, 255, 0.15);
        }

        textarea::placeholder {
            color: var(--text-secondary);
            opacity: 0.6;
        }

        /* Footer */
        .footer {
            position: fixed;
            bottom: 18px;
            right: 25px;
            font-size: 11px;
            color: var(--footer-text);
            font-weight: 400;
            letter-spacing: 0.5px;
            user-select: none;
            pointer-events: none;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container {
                padding: 28px 22px;
                border-radius: 20px;
            }

            h1 {
                font-size: 22px;
            }

            .input-group {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }

            label {
                margin-bottom: 4px;
            }

            input[type="date"],
            input[type="number"] {
                width: 100%;
            }

            .buttons {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            .theme-toggle {
                top: 15px;
                right: 15px;
                padding: 8px 14px;
                font-size: 20px;
            }

            .footer {
                bottom: 12px;
                right: 15px;
                font-size: 10px;
            }
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--accent-blue);
            border-radius: 4px;
            opacity: 0.5;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-pink);
        }
    </style>
</head>
<body>
    <div class="theme-toggle" onclick="toggleTheme()" title="Переключить тему">
        <span id="themeIcon">&#9788;</span>
    </div>

    <div class="container">
        <h1>📅 Генератор диапазонов дат</h1>
        
        <div class="info">
            <strong>Формат:</strong> <code>ДД-ДД.ММ.ГГ</code> | <strong>Вывод:</strong> в одну строку через <code>;</code> для Excel
        </div>

        <div class="input-group">
            <label for="startDate">Дата начала:</label>
            <input type="date" id="startDate">
            
            <label for="positions">Позиций:</label>
            <input type="number" id="positions" value="15" min="1" max="100">
        </div>

        <div class="buttons">
            <button onclick="generate()">🔄 Сгенерировать</button>
            <button class="copy" onclick="copy()">📋 Копировать</button>
            <button class="download" onclick="download()">💾 Скачать</button>
        </div>

        <textarea id="output" readonly placeholder="Результат появится здесь..."></textarea>
    </div>

    <div class="footer" id="footer"></div>

    <script>
        // Set default date to today or specific date
        function setDefaultDate() {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            document.getElementById('startDate').value = `${yyyy}-${mm}-${dd}`;
        }

        // Theme toggle
        let currentTheme = localStorage.getItem('theme') || 'light';
        
        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            const icon = document.getElementById('themeIcon');
            icon.innerHTML = theme === 'light' ? '&#9788;' : '&#9790;';
            localStorage.setItem('theme', theme);
        }

        function toggleTheme() {
            currentTheme = currentTheme === 'light' ? 'dark' : 'light';
            applyTheme(currentTheme);
        }

        // Initialize theme
        applyTheme(currentTheme);

        // Set footer with current date
        function updateFooter() {
            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            document.getElementById('footer').textContent = `ASD ©${yyyy}·${mm}·${dd}`;
        }

        // Parse date from date input (YYYY-MM-DD)
        function parseDate(dateStr) {
            return new Date(dateStr + 'T00:00:00');
        }

        // Format date as DD.MM.YY
        function fmt(d) {
            const day = String(d.getDate()).padStart(2, '0');
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const year = String(d.getFullYear()).slice(-2);
            return `${day}.${month}.${year}`;
        }

        // Generate ranges
        function generate() {
            const startDateStr = document.getElementById('startDate').value;
            if (!startDateStr) {
                alert('Пожалуйста, выберите дату начала');
                return;
            }

            const start = parseDate(startDateStr);
            const n = parseInt(document.getElementById('positions').value) || 15;
            
            let ranges = [];
            for (let i = 0; i < n; i++) {
                const dd1 = new Date(start.getTime() + i * 7 * 24 * 60 * 60 * 1000);
                const dd2 = new Date(dd1.getTime() + 3 * 24 * 60 * 60 * 1000);
                
                // Format: ДД-ДД.ММ.ГГ (например: 23-26.03.26)
                const d1 = String(dd1.getDate()).padStart(2, '0');
                const d2 = String(dd2.getDate()).padStart(2, '0');
                const my = String(dd1.getMonth() + 1).padStart(2, '0') + '.' + String(dd1.getFullYear()).slice(-2);
                
                ranges.push(`${d1}-${d2}.${my}`);
            }
            
            document.getElementById('output').value = ranges.join(';');
        }

        // Copy to clipboard
        async function copy() {
            const t = document.getElementById('output');
            if (!t.value) {
                alert('Сначала сгенерируйте данные');
                return;
            }
            
            try {
                await navigator.clipboard.writeText(t.value);
                alert('✅ Скопировано! Вставляйте в Excel — распределится по ячейкам строки.');
            } catch (err) {
                // Fallback for older browsers
                t.select();
                document.execCommand('copy');
                alert('✅ Скопировано! Вставляйте в Excel — распределится по ячейкам строки.');
            }
        }

        // Download as CSV
        function download() {
            const value = document.getElementById('output').value;
            if (!value) {
                alert('Сначала сгенерируйте данные');
                return;
            }
            
            const blob = new Blob([value], { type: 'text/csv;charset=utf-8;' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'ranges.csv';
            a.click();
            URL.revokeObjectURL(a.href);
        }

        // Initialize on load
        window.onload = function() {
            setDefaultDate();
            updateFooter();
            generate();
        };
    </script>
</body>
</html>
