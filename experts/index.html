<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ASD Справочники</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-gradient-start: #f0f7f0;
            --bg-gradient-end: #e2ece2;
            --glass-bg: rgba(255, 255, 255, 0.45);
            --glass-border: rgba(255, 255, 255, 0.6);
            --text-primary: #2c3e2f;
            --text-secondary: #4a6741;
            --text-muted: #7a9a6e;
            --card-bg: rgba(245, 250, 240, 0.7);
            --card-hover: rgba(255, 255, 255, 0.85);
            --shadow: 0 8px 32px rgba(0, 20, 0, 0.08);
            --footer-text: #9bbf8f;
        }

        body.dark {
            --bg-gradient-start: #1a2a1f;
            --bg-gradient-end: #0f1a0e;
            --glass-bg: rgba(30, 45, 28, 0.5);
            --glass-border: rgba(70, 100, 65, 0.4);
            --text-primary: #d4e8cf;
            --text-secondary: #b8d4b0;
            --text-muted: #7a9a6e;
            --card-bg: rgba(35, 55, 32, 0.6);
            --card-hover: rgba(45, 70, 42, 0.85);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --footer-text: #5a7a4e;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
            min-height: 100vh;
            padding: 2rem 1.5rem;
            color: var(--text-primary);
            transition: background 0.3s ease, color 0.2s ease;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            width: 300px;
            height: 300px;
            top: -100px;
            left: -100px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(180, 210, 160, 0.25), transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            width: 400px;
            height: 400px;
            bottom: -150px;
            right: -150px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(160, 200, 140, 0.2), transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2.5rem;
            padding: 0 0.5rem;
        }

        .title-section h1 {
            font-size: 2.2rem;
            font-weight: 600;
            background: linear-gradient(120deg, var(--text-primary), var(--text-secondary));
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .title-section p {
            color: var(--text-muted);
            margin-top: 0.3rem;
            font-size: 0.9rem;
        }

        .theme-toggle {
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
            border-radius: 60px;
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.2s ease;
            color: var(--text-primary);
            box-shadow: var(--shadow);
        }

        .theme-toggle:hover {
            transform: scale(1.02);
            background: var(--card-hover);
        }

        .category {
            margin-bottom: 2rem;
        }

        .category-title {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1.5rem;
            font-weight: 500;
            margin-bottom: 1rem;
            padding-left: 0.5rem;
            border-left: 4px solid #7a9a6e;
            color: var(--text-primary);
        }

        .cards-grid {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(6px);
            border: 1px solid var(--glass-border);
            border-radius: 1.2rem;
            transition: all 0.25s cubic-bezier(0.2, 0, 0, 1);
            overflow: hidden;
        }

        .glass-card:hover {
            background: var(--card-hover);
            transform: translateX(6px);
            box-shadow: var(--shadow);
        }

        .glass-card a {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 1.5rem;
            text-decoration: none;
            color: var(--text-primary);
            font-weight: 480;
        }

        .file-icon {
            font-size: 1.5rem;
            min-width: 2.2rem;
            text-align: center;
        }

        .file-details {
            flex: 1;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .file-name {
            font-family: monospace;
            font-size: 0.8rem;
            background: rgba(0, 0, 0, 0.1);
            padding: 0.2rem 0.6rem;
            border-radius: 2rem;
            color: var(--text-secondary);
        }

        .arrow {
            font-size: 1.1rem;
            opacity: 0.4;
            transition: opacity 0.2s, transform 0.2s;
        }

        .glass-card:hover .arrow {
            opacity: 0.9;
            transform: translateX(3px);
        }

        .footer {
            position: fixed;
            bottom: 1rem;
            right: 1.5rem;
            font-size: 0.7rem;
            color: var(--footer-text);
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(4px);
            padding: 0.2rem 0.7rem;
            border-radius: 2rem;
            pointer-events: none;
            z-index: 10;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
        }

        @media (max-width: 620px) {
            body { padding: 1.2rem; }
            .glass-card a { flex-wrap: wrap; gap: 0.5rem; }
            .file-details { width: 100%; }
            .footer { bottom: 0.7rem; right: 0.8rem; font-size: 0.6rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="title-section">
            <h1>📘 ASD справочники</h1>
            <p>автоматическое обновление из репозитория</p>
        </div>
        <div class="theme-toggle" id="themeToggle">☼ / ☾</div>
    </div>

    <div id="content">
        <div class="loading">📂 Загрузка структуры файлов...</div>
    </div>
</div>
<div class="footer" id="footerDate">ASD © <span id="currentDate"></span></div>

<script>
    // Переключение темы
    const themeToggle = document.getElementById('themeToggle');
    const body = document.body;
    if (localStorage.getItem('theme') === 'dark') body.classList.add('dark');
    themeToggle.addEventListener('click', () => {
        body.classList.toggle('dark');
        localStorage.setItem('theme', body.classList.contains('dark') ? 'dark' : 'light');
    });

    // Дата
    const today = new Date();
    document.getElementById('currentDate').textContent = `${today.getFullYear()}·${String(today.getMonth()+1).padStart(2,'0')}·${String(today.getDate()).padStart(2,'0')}`;

    // Конфигурация
    const USER = '177ASD';
    const REPO = 'ReferenceBooks';
    const BRANCH = 'main';
    const FOLDERS = ['00', 'experts'];

    // Иконки по расширениям
    function getIcon(fileName) {
        const ext = fileName.split('.').pop().toLowerCase();
        if (ext === 'html') return '🌐';
        if (ext === 'pdf') return '📑';
        if (ext === 'txt') return '📄';
        if (ext === 'docx') return '📝';
        return '📄';
    }

    // Формируем ссылку на GitHub Pages
    function getPageUrl(filePath) {
        return `https://${USER}.github.io/${REPO}/${encodeURI(filePath)}`;
    }

    async function fetchFolderContents(folderPath) {
        const apiUrl = `https://api.github.com/repos/${USER}/${REPO}/contents/${folderPath}?ref=${BRANCH}`;
        try {
            const response = await fetch(apiUrl);
            if (!response.ok) {
                if (response.status === 404) return [];
                throw new Error(`HTTP ${response.status}`);
            }
            const data = await response.json();
            return Array.isArray(data) ? data : [];
        } catch (error) {
            console.warn(`Ошибка загрузки ${folderPath}:`, error);
            return [];
        }
    }

    async function buildNavigation() {
        const container = document.getElementById('content');
        if (!container) return;

        let html = '';
        
        for (const folder of FOLDERS) {
            const files = await fetchFolderContents(folder);
            const htmlFiles = files.filter(f => f.type === 'file' && (f.name.endsWith('.html') || f.name.endsWith('.pdf') || f.name.endsWith('.txt') || f.name.endsWith('.docx')));
            
            if (htmlFiles.length === 0) continue;
            
            html += `<div class="category">
                        <div class="category-title">
                            <span>📁 ${folder}/</span>
                        </div>
                        <div class="cards-grid">`;
            
            for (const file of htmlFiles) {
                const filePath = `${folder}/${file.name}`;
                const fileUrl = getPageUrl(filePath);
                const icon = getIcon(file.name);
                
                html += `<div class="glass-card">
                            <a href="${fileUrl}" target="_blank">
                                <div class="file-icon">${icon}</div>
                                <div class="file-details">
                                    <span>${file.name.replace(/\.(html|pdf|txt|docx)$/i, '')}</span>
                                    <span class="file-name">${file.name}</span>
                                </div>
                                <div class="arrow">→</div>
                            </a>
                         </div>`;
            }
            
            html += `</div></div>`;
        }
        
        if (html === '') {
            html = '<div class="loading">📭 Нет доступных файлов. Проверьте папки 00/ и experts/ в репозитории.</div>';
        }
        
        container.innerHTML = html;
    }

    buildNavigation();
</script>
</body>
</html>
