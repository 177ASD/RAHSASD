
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Агростраховая экспертиза</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Светлая тема */
        body.light {
            background: radial-gradient(circle at 10% 20%, #f5f0eb 0%, #ebe1d7 100%);
            color: #2c2c2c;
        }
        body.light .glass-card {
            background: rgba(245, 240, 235, 0.55);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,245,0.5);
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
        }
        body.light .file-link {
            background: rgba(250, 248, 245, 0.7);
            border-bottom: 1px solid rgba(0,0,0,0.05);
            color: #2c2c2c;
        }
        body.light .file-link:hover {
            background: rgba(255,255,250,0.9);
            border-left: 3px solid #b87333;
            transform: translateX(4px);
        }
        body.light .theme-toggle {
            background: rgba(30,30,40,0.08);
            color: #3e3a3a;
            border: 1px solid rgba(0,0,0,0.1);
        }
        body.light .path-badge {
            background: rgba(0,0,0,0.04);
        }
        body.light .file-ext {
            background: rgba(0,0,0,0.05);
        }

        /* Тёмная тема */
        body.dark {
            background: radial-gradient(circle at 30% 10%, #1e2a2e 0%, #0f1a1f 100%);
            color: #dddcd8;
        }
        body.dark .glass-card {
            background: rgba(20, 30, 32, 0.6);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(210, 205, 190, 0.2);
            box-shadow: 0 12px 28px rgba(0,0,0,0.4);
        }
        body.dark .file-link {
            background: rgba(35, 45, 50, 0.65);
            border-bottom: 1px solid rgba(210,205,180,0.1);
            color: #eae7df;
        }
        body.dark .file-link:hover {
            background: rgba(65, 80, 85, 0.8);
            border-left: 3px solid #c99e6f;
            transform: translateX(4px);
        }
        body.dark .theme-toggle {
            background: rgba(210,205,180,0.12);
            color: #ece7dd;
            border: 1px solid rgba(230,220,200,0.25);
        }
        body.dark .path-badge {
            background: rgba(255,255,210,0.08);
        }
        body.dark .file-ext {
            background: rgba(230,220,200,0.12);
        }

        .glass-card {
            max-width: 780px;
            width: 100%;
            margin: 1rem auto;
            border-radius: 2.5rem;
            padding: 2rem 1.8rem 2rem 1.8rem;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(128, 128, 128, 0.2);
            padding-bottom: 0.75rem;
        }
        h1 {
            font-weight: 520;
            font-size: 1.85rem;
            letter-spacing: -0.3px;
        }
        .path-badge {
            font-family: monospace;
            font-size: 0.8rem;
            opacity: 0.7;
            padding: 0.2rem 0.6rem;
            border-radius: 40px;
            display: inline-block;
            margin-top: 0.3rem;
        }

        .theme-toggle {
            cursor: pointer;
            background: none;
            border: none;
            font-size: 1.7rem;
            line-height: 1;
            padding: 0.4rem 0.8rem;
            border-radius: 60px;
        }
        .theme-toggle:hover {
            opacity: 0.75;
            transform: scale(0.96);
        }

        .file-list {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin: 1.5rem 0 0.5rem;
        }
        .file-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
            padding: 0.9rem 1.2rem;
            border-radius: 1.6rem;
            text-decoration: none;
            font-weight: 460;
            transition: all 0.2s ease;
        }
        .file-name {
            font-size: 1rem;
            word-break: break-word;
            flex: 1;
        }
        .file-ext {
            font-size: 0.7rem;
            font-family: monospace;
            opacity: 0.7;
            padding: 0.2rem 0.7rem;
            border-radius: 40px;
        }

        .footer-note {
            margin-top: 2.5rem;
            text-align: right;
            font-size: 0.7rem;
            opacity: 0.5;
            font-family: monospace;
            border-top: 0.5px solid rgba(128,128,128,0.2);
            padding-top: 1rem;
        }

        @media (max-width: 560px) {
            body { padding: 1rem; }
            .glass-card { padding: 1.5rem; }
            h1 { font-size: 1.5rem; }
            .file-link { padding: 0.7rem 1rem; }
        }
    </style>
</head>
<body class="light">
    <div class="glass-card">
        <div class="header-row">
            <div>
                <h1>Агростраховая экспертиза</h1>
                <div class="path-badge">//документы/</div>
            </div>
            <button class="theme-toggle" id="themeSwitcher" aria-label="светлая/темная тема">&#9788;</button>
        </div>

        <div id="fileListContainer" class="file-list"></div>

        <div class="footer-note" id="copyrightDate">ASD © </div>
    </div>

    <script>
        // ========== НАСТРОЙКИ (МЕНЯЙТЕ ЗДЕСЬ) ==========
        // Репозиторий и папка для GitHub Pages
        const GITHUB_USER = '177asd';
        const REPO_NAME = 'RAHSASD';
        const FOLDER_NAME = 'InfoDocs';

        // СПИСОК ФАЙЛОВ (ДОБАВЛЯЙТЕ / УДАЛЯЙТЕ ЗДЕСЬ)
        // формат: { name: "имя_файла.расширение" }
        const FILES_LIST = [
            { name: "RedZoneBranches.html" },
            { name: "RaPex_fullData.html" },
           /* { name: "Тарифы&Коэффициенты.html" },
            { name: "Филиалы&Эксперты.html" }*/
        ];
        // ==============================================

        // Базовый URL для ссылок на GitHub Pages
        const BASE_URL = `https://${GITHUB_USER}.github.io/${REPO_NAME}/${FOLDER_NAME}/`;

        function renderFileList() {
            const container = document.getElementById('fileListContainer');
            if (!container) return;

            if (!FILES_LIST || FILES_LIST.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:2rem; opacity:0.6;">папка пуста</div>`;
                return;
            }

            let html = '';
            FILES_LIST.forEach((file, idx) => {
                const fileName = file.name;
                const encodedName = encodeURIComponent(fileName);
                const fileUrl = BASE_URL + encodedName;
                const ext = fileName.split('.').pop() || '';
                const displayExt = ext.length < 8 ? ext.toUpperCase() : ext.slice(0, 6);

                html += `
                    <a class="file-link" href="${fileUrl}" target="_blank" rel="noopener noreferrer" style="animation: none;">
                        <span class="file-name">${escapeHtml(fileName)}</span>
                        <span class="file-ext">${escapeHtml(displayExt)}</span>
                    </a>
                `;
            });
            container.innerHTML = html;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // ТЕМЫ
        function initTheme() {
            const saved = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = saved === 'dark' || (saved === null && prefersDark) ? 'dark' : 'light';
            setTheme(theme);
        }

        function setTheme(theme) {
            const body = document.body;
            const btn = document.getElementById('themeSwitcher');
            if (theme === 'dark') {
                body.classList.remove('light');
                body.classList.add('dark');
                if (btn) btn.innerHTML = '&#9790;';
                localStorage.setItem('theme', 'dark');
            } else {
                body.classList.remove('dark');
                body.classList.add('light');
                if (btn) btn.innerHTML = '&#9788;';
                localStorage.setItem('theme', 'light');
            }
        }

        function toggleTheme() {
            const isDark = document.body.classList.contains('dark');
            setTheme(isDark ? 'light' : 'dark');
        }

        function setFooterDate() {
            const footer = document.getElementById('copyrightDate');
            if (footer) {
                const now = new Date();
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                footer.textContent = `ASD © ${year}·${month}·${day}`;
            }
        }

        // ЗАПУСК
        initTheme();
        setFooterDate();
        renderFileList();

        const switcher = document.getElementById('themeSwitcher');
        if (switcher) switcher.addEventListener('click', toggleTheme);
    </script>
</body>
</html>
