<style>

.container { display: flex; height: 100vh; width: 100%; }

#mapLayerSelect { padding: 4px 8px; border-radius: 4px; border: 1px solid #d7ccc8; background: #fff; color: #5d4037; font-size: 12px; cursor: pointer; outline: none; }

.search-box { padding: 10px 20px; border-bottom: 1px solid #e8e4db; flex-shrink: 0; }
.search-box input { width: 100%; padding: 10px 14px; background: #faf9f6; border: 1px solid #d7ccc8; border-radius: 6px; color: #5d4037; font-size: 13px; transition: all 0.2s ease; }

.filters { padding: 10px 20px; border-bottom: 1px solid #e8e4db; flex-shrink: 0; }
.filter-label { font-size: 11px; color: #8d6e63; margin-bottom: 8px; display: block; font-weight: 600; }
.filter-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.filter-checkbox { display: flex; align-items: center; padding: 6px 10px; background: #fff; border: 1px solid #e0dcd3; border-radius: 6px; cursor: pointer; transition: all 0.2s ease; font-size: 12px; }
.filter-checkbox:hover { background: #fff8e1; border-color: #ffcc80; }
.filter-checkbox input { margin-right: 8px; width: 14px; height: 14px; accent-color: #ef6c00; cursor: pointer; }
.filter-checkbox span { font-size: 12px; color: #5d4037; user-select: none; }
.filter-checkbox.active { background: #fff3e0; border-color: #ffb74d; }
.filter-actions { margin-top: 8px; display: flex; gap: 8px; }
.filter-btn-small { flex: 1; padding: 6px; background: #efebe9; border: 1px solid #d7ccc8; border-radius: 6px; color: #5d4037; font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.2s ease; }
.filter-btn-small:hover { background: #d7ccc8; }
#filial-details { padding: 15px 20px; background: #fff; border-bottom: 1px solid #e0dcd3; display: none; flex-shrink: 0; animation: fadeIn 0.3s ease-in-out; max-height: 45vh; overflow-y: auto; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
.detail-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; border-bottom: 1px solid #f4f1ea; padding-bottom: 8px; }
.detail-title { font-size: 16px; font-weight: 700; color: #4e342e; }
.detail-close { cursor: pointer; font-size: 18px; color: #a1887f; line-height: 1; }
.detail-close:hover { color: #ef6c00; }
.detail-section { margin-bottom: 8px; }
.detail-label { font-size: 10px; text-transform: uppercase; color: #a1887f; letter-spacing: 0.5px; margin-bottom: 2px; }
.detail-value { font-size: 13px; color: #5d4037; }
.detail-experts-block { background-color: #f1f8e9; border-radius: 6px; padding: 8px; margin-top: 8px; border-left: 3px solid #aed581; }
.detail-expert-item { display: flex; align-items: center; font-size: 12px; color: #33691e; margin-bottom: 2px; }
.detail-expert-item:last-child { margin-bottom: 0; }
.detail-contacts { background: #f9f7f4; border-radius: 6px; padding: 8px; margin-top: 8px; }
.contact-row { display: flex; align-items: center; margin-bottom: 4px; font-size: 12px; }
.contact-row:last-child { margin-bottom: 0; }
.contact-icon { width: 14px; text-align: center; margin-right: 6px; opacity: 0.7; font-size: 11px; }
.contact-link { color: #5d4037; text-decoration: none; }
.contact-link:hover { text-decoration: underline; color: #ef6c00; }
.filials-list { flex: 1; overflow-y: auto; padding: 10px; min-height: 0; }

.filials-list::-webkit-scrollbar-track { background: #f4f1ea; }
.filials-list::-webkit-scrollbar-thumb { background: #a1887f; border-radius: 3px; }
.filial-item { padding: 10px 12px; margin-bottom: 6px; background: #fff; border-radius: 8px; cursor: pointer; transition: all 0.2s ease; border: 1px solid transparent; }

const map = L.map('map', { zoomControl: false }).setView([55.7558, 37.6173], 4);
L.control.zoom({ position: 'bottomleft' }).addTo(map);

const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '' });
const cartodbLightLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { attribution: '' });
const esriGrayLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', { attribution: '' });

let currentLayer = osmLayer;
currentLayer.addTo(map);

function changeMapLayer() {
const select = document.getElementById('mapLayerSelect');
const selectedValue = select.value;
map.removeLayer(currentLayer);
if (selectedValue === 'osm') { currentLayer = osmLayer; } 
else if (selectedValue === 'cartodb_light') { currentLayer = cartodbLightLayer; } 
else if (selectedValue === 'esri_gray') { currentLayer = esriGrayLayer; }
currentLayer.addTo(map);
}

const markers = {};
const activeFilters = new Set();
const radiusLayerGroup = L.layerGroup().addTo(map);

function showFilialDetails(filial) {
const detailsPanel = document.getElementById('filial-details');
if (!detailsPanel) return;
document.getElementById('detail-name').textContent = filial.name;
document.getElementById('detail-region').textContent = filial.region;
document.getElementById('detail-fo').textContent = filial.fo;
document.getElementById('detail-fo').style.color = foColors[filial.fo] || '#333';
document.getElementById('detail-address').textContent = filial.address;

const expertsContainer = document.getElementById('detail-experts-container');
const expertsList = document.getElementById('detail-experts-list');
expertsList.innerHTML = '';

let baseName = filial.name;
if (baseName.includes(' отд.')) { baseName = baseName.split(' отд.')[0]; }
const experts = expertsMap[baseName];

if (experts && experts.length > 0) {
expertsContainer.style.display = 'block';
experts.forEach(exp => {
const div = document.createElement('div');
div.className = 'detail-expert-item';
div.innerHTML = `<span style="margin-right:6px;">👤</span> ${exp}`;
expertsList.appendChild(div);
});
} else {
expertsContainer.style.display = 'none';
}

const contactsContainer = document.getElementById('detail-contacts-container');
contactsContainer.innerHTML = '';
if (filial.email) { contactsContainer.innerHTML += `<div class="contact-row"><span class="contact-icon">✉️</span><a href="mailto:${filial.email}" class="contact-link">${filial.email}</a></div>`; }
if (filial.site) { contactsContainer.innerHTML += `<div class="contact-row"><span class="contact-icon">🌐</span><a href="${filial.site}" target="_blank" class="contact-link">${filial.site.replace('https://','')}</a></div>`; }

detailsPanel.style.display = 'block';
}

function closeDetails() {
document.getElementById('filial-details').style.display = 'none';
radiusLayerGroup.clearLayers();
resetAllMarkers();
document.querySelectorAll('.filial-item').forEach(el => el.classList.remove('active'));
}

function showRadius(centerFilial) {
radiusLayerGroup.clearLayers();
const centerLat = centerFilial.lat;
const centerLng = centerFilial.lng;
const radiusMeters = 120000;

for (let r = 40000; r < radiusMeters; r += 40000) {
L.circle([centerLat, centerLng], {
radius: r, color: '#8D6E63', fillColor: 'transparent', weight: 1, opacity: 0.5, dashArray: '10, 10'
}).addTo(radiusLayerGroup);
}

L.circle([centerLat, centerLng], {
radius: radiusMeters, color: '#8d6e63', fillColor: '#8d6e63', fillOpacity: 0.05, weight: 1, opacity: 0.8
}).addTo(radiusLayerGroup);

filialsData.forEach(target => {
if (target.id === centerFilial.id) return;
const dist = map.distance([centerLat, centerLng], [target.lat, target.lng]);
if (dist <= radiusMeters && activeFilters.has(target.fo)) {
L.polyline([[centerLat, centerLng], [target.lat, target.lng]], { color: '#81d4fa', weight: 2, opacity: 0.6 }).addTo(radiusLayerGroup);
const distKm = Math.round(dist / 1000);
const midLat = (centerLat + target.lat) / 2;
const midLng = (centerLng + target.lng) / 2;
const labelIcon = L.divIcon({ className: 'dist-label', html: distKm.toString(), iconSize: [0, 0], iconAnchor: [0, 0] });
L.marker([midLat, midLng], { icon: labelIcon }).addTo(radiusLayerGroup);
if (markers[target.id]) {
const blueIcon = L.divIcon({ className: 'custom-marker-container', html: `<div class="custom-marker" style="width: 16px; height: 16px; background: #2196f3; border: 2px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.3);"></div>`, iconSize: [16, 16], iconAnchor: [8, 8] });
markers[target.id].setIcon(blueIcon);
}
}
});
}

map.on('click', function() { closeDetails(); });

function resetAllMarkers() {
filialsData.forEach(f => {
if (markers[f.id]) {
const isDepartment = f.name.includes('отд.');
const color = foColors[f.fo] || '#8d6e63';
let baseName = f.name;
if (baseName.includes(' отд.')) { baseName = baseName.split(' отд.')[0]; }
const expertsList = expertsMap[baseName];
const expertsCount = expertsList ? expertsList.length : 0;
const hasExperts = expertsCount > 0;
const opacityValue = hasExperts ? '1.0' : '0.6';

let iconHtml = '';
if (isDepartment) {
if (hasExperts) {
iconHtml = `<div style="width:16px;height:16px;background:${color};transform:rotate(45deg);border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,0.3);opacity:${opacityValue};display:flex;align-items:center;justify-content:center;"><span style="transform:rotate(-45deg);color:white;font-size:8px;font-weight:bold;">${expertsCount}</span></div>`;
} else {
iconHtml = `<div style="width:16px;height:16px;background:${color};transform:rotate(45deg);border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,0.3);opacity:${opacityValue};"></div>`;
}
} else {
iconHtml = `<div style="width: 22px; height: 22px; background-color: ${color}; border: 2px solid #fff; border-radius: 50%; box-shadow: 0 0 0 3px ${color}40; opacity: ${opacityValue}; font-weight: ${hasExperts ? 'bold' : 'normal'}; font-size: ${hasExperts ? '11px' : '0'}; color: #fff; display: flex; align-items: center; justify-content: center;">${hasExperts ? expertsCount : ''}</div>`;
}

const originalIcon = L.divIcon({ className: 'custom-marker-container', html: iconHtml, iconSize: isDepartment ? [16, 16] : [22, 22], iconAnchor: isDepartment ? [8, 8] : [11, 11] });
markers[f.id].setIcon(originalIcon);
markers[f.id].setOpacity(1.0);
if(markers[f.id].getElement()) { markers[f.id].getElement().style.filter = "none"; }
}
});
}

function createMarker(filial) {
const isDepartment = filial.name.includes('отд.');
const color = foColors[filial.fo] || '#8d6e63';
let baseName = filial.name;
if (baseName.includes(' отд.')) { baseName = baseName.split(' отд.')[0]; }
const expertsList = expertsMap[baseName];
const expertsCount = expertsList ? expertsList.length : 0;
const hasExperts = expertsCount > 0;
const opacityValue = hasExperts ? '1.0' : '0.6';

let iconHtml = '';
if (isDepartment) {
if (hasExperts) {
iconHtml = `<div style="width:16px;height:16px;background:${color};transform:rotate(45deg);border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,0.3);opacity:${opacityValue};display:flex;align-items:center;justify-content:center;"><span style="transform:rotate(-45deg);color:white;font-size:8px;font-weight:bold;">${expertsCount}</span></div>`;
} else {
iconHtml = `<div style="width:16px;height:16px;background:${color};transform:rotate(45deg);border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,0.3);opacity:${opacityValue};"></div>`;
}
} else {
iconHtml = `<div style="width: 22px; height: 22px; background-color: ${color}; border: 2px solid #fff; border-radius: 50%; box-shadow: 0 0 0 3px ${color}40; opacity: ${opacityValue}; font-weight: ${hasExperts ? 'bold' : 'normal'}; font-size: ${hasExperts ? '11px' : '0'}; color: #fff; display: flex; align-items: center; justify-content: center;">${hasExperts ? expertsCount : ''}</div>`;
}

const icon = L.divIcon({ className: 'custom-marker-container', html: iconHtml, iconSize: isDepartment ? [16, 16] : [22, 22], iconAnchor: isDepartment ? [8, 8] : [11, 11] });
const marker = L.marker([filial.lat, filial.lng], { icon: icon }).addTo(map);

marker.on('click', function() {
document.querySelectorAll('.filial-item').forEach(el => el.classList.remove('active'));
const listItem = document.querySelector(`.filial-item[data-id="${filial.id}"]`);
if(listItem) { listItem.classList.add('active'); listItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
showFilialDetails(filial);
showRadius(filial);
});

return marker;
}

filialsData.forEach(filial => { markers[filial.id] = createMarker(filial); });

const allFo = [...new Set(filialsData.map(f => f.fo))].sort();
const filterGrid = document.getElementById('filterGrid');

allFo.forEach(fo => {
activeFilters.add(fo);
const label = document.createElement('label');
label.className = 'filter-checkbox active';
label.innerHTML = `<input type="checkbox" checked data-fo="${fo}"><span>${fo}</span>`;
const checkbox = label.querySelector('input');
checkbox.addEventListener('change', () => {
if (checkbox.checked) { activeFilters.add(fo); label.classList.add('active'); } 
else { activeFilters.delete(fo); label.classList.remove('active'); }
renderList(document.getElementById('searchInput').value);
});
filterGrid.appendChild(label);
});

document.getElementById('selectAll').addEventListener('click', () => {
document.querySelectorAll('.filter-checkbox input').forEach(cb => { cb.checked = true; activeFilters.add(cb.dataset.fo); cb.closest('.filter-checkbox').classList.add('active'); });
renderList(document.getElementById('searchInput').value);
});

document.getElementById('clearAll').addEventListener('click', () => {
document.querySelectorAll('.filter-checkbox input').forEach(cb => { cb.checked = false; activeFilters.delete(cb.dataset.fo); cb.closest('.filter-checkbox').classList.remove('active'); });
renderList(document.getElementById('searchInput').value);
});

function highlightText(text, query) {
if (!query) return text;
const regex = new RegExp(`(${query})`, 'gi');
return text.replace(regex, '<span class="highlight">$1</span>');
}

function renderList(search = '') {
const list = document.getElementById('filialsList');
list.innerHTML = '';
const searchLower = search.toLowerCase().trim();

if (searchLower !== '') {
radiusLayerGroup.clearLayers();
document.getElementById('filial-details').style.display = 'none';
}

filialsData.forEach(filial => {
const matchesFilter = activeFilters.has(filial.fo);
const nameMatch = filial.name.toLowerCase().includes(searchLower);
const regionMatch = filial.region.toLowerCase().includes(searchLower);
const emailMatch = filial.email && filial.email.toLowerCase().includes(searchLower);
const matchesSearch = searchLower === '' || nameMatch || regionMatch || emailMatch;

let contextHtml = '';
if (searchLower !== '') {
if (emailMatch) {
contextHtml += `<div class="search-context">Email: ${highlightText(filial.email, searchLower)}</div>`;
}
}

if (matchesFilter && matchesSearch) {
const item = document.createElement('div');
item.className = 'filial-item';
item.dataset.id = filial.id;
const displayName = nameMatch ? highlightText(filial.name, searchLower) : filial.name;
const displayRegion = regionMatch ? highlightText(filial.region, searchLower) : filial.region;
item.innerHTML = `
<div class="filial-header"><span class="filial-name">${displayName}</span></div>
<div class="filial-region">${displayRegion}</div>
<span class="filial-fo">${filial.fo}</span>
${contextHtml}
`;
item.addEventListener('click', () => {
document.querySelectorAll('.filial-item').forEach(el => el.classList.remove('active'));
item.classList.add('active');
map.flyTo([filial.lat, filial.lng], 8, { duration: 1.5 });
showFilialDetails(filial);
showRadius(filial);
});
list.appendChild(item);
}

if (matchesFilter) {
if (!map.hasLayer(markers[filial.id])) markers[filial.id].addTo(map);
if (!matchesSearch && searchLower !== '') {
markers[filial.id].setOpacity(0.2);
if(markers[filial.id].getElement()) { markers[filial.id].getElement().style.filter = "grayscale(100%)"; }
} else {
markers[filial.id].setOpacity(1.0);
if(markers[filial.id].getElement()) { markers[filial.id].getElement().style.filter = "none"; }
}
} else {
if (map.hasLayer(markers[filial.id])) map.removeLayer(markers[filial.id]);
}
});
}

document.getElementById('searchInput').addEventListener('input', (e) => { renderList(e.target.value); });
renderList();
</script>
